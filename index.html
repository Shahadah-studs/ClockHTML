<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Working Digital Clock</title>
    <style>
        /* Centers the clock perfectly on the page */
        body {
            background-color: #111116;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        /* Styles the container widget */
        .clock-container {
            background: linear-gradient(145deg, #181822, #1f1f2e);
            padding: 30px 50px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5),
                        inset 0 1px 2px rgba(255, 255, 255, 0.1);
            text-align: center;
            border: 1px solid #2e2e42;
        }

        /* Main time formatting */
        .time-display {
            font-size: 4rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.4);
        }

        /* Format for AM/PM label */
        .period {
            font-size: 1.5rem;
            color: #8888aa;
            margin-left: 10px;
            text-transform: uppercase;
        }

        /* Displays the current date underneath */
        .date-display {
            margin-top: 15px;
            font-size: 1.1rem;
            color: #8c8ca0;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="clock-container">
        <!-- Live Time Target -->
        <div class="time-display">
            <span id="time">00:00:00</span><span id="period" class="period">AM</span>
        </div>
        <!-- Live Date Target -->
        <div id="date" class="date-display">Loading Date...</div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Extract core time elements
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            // Determine AM/PM flag
            const period = hours >= 12 ? 'PM' : 'AM';
            
            // Convert to 12-hour format
            hours = hours % 12;
            hours = hours ? hours : 12; // The hour '0' should be '12'
            
            // Add a leading zero to numbers under 10
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            // Inject values into the DOM
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
            document.getElementById('period').textContent = period;
            
            // Format and inject the live date string
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        // Run immediately on page load, then refresh every 1,000 milliseconds (1 second)
        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
